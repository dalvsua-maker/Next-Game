server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types application/javascript text/css application/json;

    # Los datos solo cambian al regenerarlos: caché de un día en el navegador
    location /data/ {
        expires 1d;
    }

    # Nunca servir ficheros ocultos (.git, .env…)
    location ~ /\. {
        deny all;
    }

    # DNS interno de Docker. Los nombres se resuelven en cada petición,
    # así nginx arranca aunque r2s o Steam no respondan en ese momento.
    resolver 127.0.0.11 valid=300s ipv6=off;
    resolver_timeout 5s;

    # rawg-to-steam-redirect: capturas, fondo y descripción de Steam
    location /api/ {
        set $r2s http://r2s:9999;
        proxy_pass $r2s;
        proxy_read_timeout 60s;
    }

    # Tienda de Steam (tráileres y descripción en español). Steam no permite que la página lo pida directamente.
    location /steam-store/ {
        set $store https://store.steampowered.com;
        rewrite ^/steam-store/(.*)$ /$1 break;
        proxy_pass $store;
        proxy_set_header Host store.steampowered.com;
        proxy_set_header Cookie "birthtime=0; wants_mature_content=1";
        proxy_ssl_server_name on;
    }

    # API pública de Steam (ruta exacta de las carátulas de juegos recientes)
    location /steam-api/ {
        set $steamapi https://api.steampowered.com;
        rewrite ^/steam-api/(.*)$ /$1 break;
        proxy_pass $steamapi;
        proxy_set_header Host api.steampowered.com;
        proxy_ssl_server_name on;
    }
}
